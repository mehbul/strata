    <!--
      THESIS: A local inference console in the conventional developer-chat canon,
      played straight. It refuses its own predecessor's arrangement — a sidebar and
      tab bar of instruments framing the conversation — because chrome around the
      chat is what made the tool read as someone else's. Here the conversation is
      the page and every instrument collapses behind one toggle.
      OWN-WORLD: Neutral near-black (#1b1b1b) with a #161616 panel, system font
      stack, monospace reserved for measurement. One near-white primary action, a
      green/amber/red status trio, and 1px hairlines — no second accent, no shadow.
      STORY: The operator asks something, watches it stream, and opens the inspector
      only when they want to know why it was fast or slow.
      FIRST VIEWPORT: 48px top bar (mark, model, status, toggles); centred 46rem
      conversation column; rounded composer pinned bottom-centre; 320px inspector
      on the right, dismissible to nothing.
      FORM: The category standard, taken as the standing exit from the direction
      round at the user's request; Codex and ChatGPT are the named craft bar. seed e91e27b2.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
